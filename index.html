<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INVENT SUN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:#04040c; color:#e8edff; font-family:'Space Grotesk',sans-serif; overflow:hidden; user-select:none; }
  #bg { position:fixed; inset:0; background:
      radial-gradient(60% 50% at 18% 18%, rgba(96,48,168,0.28), transparent 70%),
      radial-gradient(55% 45% at 82% 72%, rgba(32,96,168,0.24), transparent 70%),
      radial-gradient(38% 32% at 62% 26%, rgba(168,52,96,0.16), transparent 70%),
      #04040c; }
  canvas#space { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #hud { position:fixed; top:0; left:0; right:0; text-align:center; pointer-events:none; z-index:5; }
  #hud h1 { font-family:'Orbitron',sans-serif; font-weight:900; font-size:clamp(18px,3.4vw,30px); letter-spacing:0.4em; margin-top:16px; color:#fff;
    text-shadow:0 0 16px rgba(255,205,110,0.9), 0 0 48px rgba(255,140,70,0.55); }
  #hud p { font-size:10px; letter-spacing:0.3em; text-transform:uppercase; color:rgba(200,214,255,0.5); margin-top:6px; }
  #hud p.hint { margin-top:2px; color:rgba(190,205,255,0.32); }
  #dock { position:fixed; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; z-index:5; }
  #energy-wrap { width:min(400px,82vw); }
  #energy-bar { height:6px; border-radius:3px; background:rgba(255,255,255,0.08); overflow:hidden; }
  #energy-fill { height:100%; width:0%; border-radius:3px; background:linear-gradient(90deg,#7dff9b,#4dd8ff); box-shadow:0 0 12px rgba(125,255,155,0.7); transition:width .2s ease, background .3s ease; }
  #energy-fill.full { background:linear-gradient(90deg,#ffe066,#ff7a3c); box-shadow:0 0 16px rgba(255,200,80,0.9); }
  #ignite-wrap { margin-top:10px; }
  #ignite { font-family:'Orbitron',sans-serif; font-weight:700; font-size:18px; letter-spacing:0.25em; width:150px; height:150px; border-radius:50%;
    border:2px solid rgba(255,220,150,0.7); background:radial-gradient(circle, rgba(255,150,60,0.9), rgba(255,60,30,0.55) 55%, rgba(120,20,60,0.4));
    color:#fff; cursor:pointer; opacity:0.3; transition:opacity .3s, transform .15s;
    box-shadow:0 0 40px rgba(255,110,50,0.5), inset 0 0 30px rgba(255,180,80,0.6);
    text-shadow:0 0 10px rgba(255,220,120,0.9); }
  #ignite.ready { opacity:1; animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 40px rgba(255,110,50,0.5), inset 0 0 30px rgba(255,180,80,0.6);} 50% { box-shadow:0 0 72px rgba(255,150,60,1), inset 0 0 46px rgba(255,190,90,0.9);} }
  #controls { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:12px 12px 18px; max-width:min(760px,94vw); }
  .chip { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12px; letter-spacing:0.08em;
    padding:10px 14px; border-radius:999px; border:1px solid rgba(255,255,255,0.16); background:rgba(20,24,48,0.6);
    color:#cdd6ff; cursor:pointer; backdrop-filter:blur(4px); transition:transform .12s, border-color .2s, color .2s, box-shadow .2s; }
  .chip:hover:not(:disabled) { transform:translateY(-2px); border-color:rgba(255,210,140,0.7); color:#fff; }
  .chip:disabled { opacity:0.32; cursor:not-allowed; }
  .chip.on { border-color:#ffb35c; color:#fff; background:rgba(90,40,20,0.55); box-shadow:0 0 14px rgba(255,140,60,0.35) inset; }
  #overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(3,4,12,0.72); backdrop-filter:blur(6px); z-index:10; }
  #overlay.show { display:flex; }
  #panel { text-align:center; padding:34px 46px; border-radius:18px; border:1px solid rgba(255,220,150,0.35); background:rgba(12,10,30,0.88); box-shadow:0 0 60px rgba(255,130,60,0.25); }
  #panel h2 { font-family:'Orbitron',sans-serif; letter-spacing:0.25em; font-size:22px; color:#fff; text-shadow:0 0 16px rgba(255,190,90,0.8); }
  #panel #score-big { font-family:'Orbitron',sans-serif; font-size:52px; font-weight:900; color:#ffe9b0; text-shadow:0 0 24px rgba(255,180,60,0.7); margin-top:8px; }
  #panel p { margin-top:6px; color:rgba(200,214,255,0.7); font-size:13px; letter-spacing:0.12em; }
  #panel button { margin-top:22px; font-family:'Orbitron',sans-serif; font-weight:700; letter-spacing:0.2em; font-size:12px; padding:13px 26px; border-radius:999px; border:1px solid rgba(255,220,150,0.6); background:rgba(120,50,20,0.4); color:#fff; cursor:pointer; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="space"></canvas>
<div id="hud">
  <h1>INVENT SUN</h1>
  <p>the cosmic invention workshop</p>
  <p class="hint">click inventions · reach full energy · ignite</p>
</div>
<div id="dock">
  <div id="energy-wrap">
    <div id="energy-bar"><div id="energy-fill"></div></div>
  </div>
  <div id="ignite-wrap"><button id="ignite">IGNITE</button></div>
  <div id="controls"></div>
</div>
<div id="overlay">
  <div id="panel">
    <h2>STAR INVENTED</h2>
    <div id="score-big">0</div>
    <p id="panel-sub">best score</p>
    <button id="again">INVENT ANOTHER</button>
  </div>
</div>
<script>
const canvas = document.getElementById('space');
const ctx = canvas.getContext('2d');
const energyFill = document.getElementById('energy-fill');
const igniteBtn = document.getElementById('ignite');
const controlsEl = document.getElementById('controls');
const overlay = document.getElementById('overlay');
const panelScore = document.getElementById('score-big');
const panelSub = document.getElementById('panel-sub');
const againBtn = document.getElementById('again');

const COMPONENTS = [
  { id:'core',   name:'Stellar Core',   cost:15, color:'#fff6dd' },
  { id:'plasma', name:'Plasma',         cost:20, color:'#ff9a3c' },
  { id:'magnet', name:'Magnetosphere', cost:25, color:'#6cb8ff' },
  { id:'flare',  name:'Stellar Flare', cost:35, color:'#ff5a2a' },
  { id:'nova',   name:'Nova Shell',     cost:45, color:'#b26bff' },
  { id:'fusion', name:'Fusion Heart',  cost:50, color:'#ffe066' },
];
const PN_COLORS = ['#fff3b0','#ffb347','#ff5a2a','#b26bff','#6cb8ff','#8a93b2'];

let phase = 'idle';
let energy = 0;
let layers = [];
let cycle = 0;
let baseR = 34;
let score = 0;
let best = parseInt(localStorage.getItem('invent-sun-best') || '0', 10);
let particles = [];
let flashA = 0;
let stars = [];
let raf = 0;

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function costOf(id) { const c = COMPONENTS.find(c => c.id === id); return c ? c.cost : 0; }
function layerColor() { for (let i = layers.length - 1; i >= 0; i--) { const c = COMPONENTS.find(c => c.id === layers[i]); if (c) return c.color; } return '#8a93b2'; }
function sunR() { return baseR * (1 + layers.length * 0.55); }
function sunX() { return innerWidth / 2; }
function sunY() { return innerHeight * 0.44; }

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  stars = Array.from({ length: Math.floor(innerWidth / 9) }, () => ({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight,
    r: Math.random() * 1.3 + 0.3, tw: Math.random() * Math.PI * 2, spd: 0.4 + Math.random()
  }));
}
window.addEventListener('resize', resize);
resize();

function renderChips() {
  controlsEl.innerHTML = '';
  for (const c of COMPONENTS) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = c.name.toUpperCase();
    b.onclick = () => addLayer(c.id);
    if (energy + c.cost > 100) b.disabled = true;
    controlsEl.appendChild(b);
  }
}
function updateEnergyUI() {
  energyFill.style.width = energy + '%';
  energyFill.classList.toggle('full', energy >= 100);
  igniteBtn.classList.toggle('ready', phase === 'idle' && energy >= 100);
  renderChips();
}

function addLayer(id) {
  if (phase !== 'idle') return;
  const c = COMPONENTS.find(c => c.id === id);
  if (!c) return;
  if (energy + c.cost > 100) return;
  layers.push(id);
  energy = Math.min(100, energy + c.cost);
  updateEnergyUI();
}

function ignite() {
  if (phase !== 'idle') return;
  phase = 'explode';
  const r = sunR();
  for (let i = 0; i < 170; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = (2.5 + Math.random() * 6.5) * (r / 34);
    particles.push({
      x: sunX() + r * 0.75 * Math.cos(a), y: sunY() + r * 0.75 * Math.sin(a),
      vx: -Math.sin(a) * sp, vy: -Math.cos(a) * sp,
      life: 50 + Math.random() * 50, max: 100, size: 1 + Math.random() * 2.6,
      color: PN_COLORS[(Math.random() * PN_COLORS.length) | 0]
    });
  }
  flashA = 0.85;
  cycle++;
  baseR = 34 * Math.pow(1.12, cycle);
  igniteBtn.classList.remove('ready');
}

function drawSun(t) {
  const r = sunR() * (phase === 'idle' ? 1 + 0.03 * Math.sin(t * 0.8) : 1);
  const col = layerColor();
  const c = sunX(), y = sunY();
  const glow = ctx.createRadialGradient(c, y, 0, c, y, r * 3.4);
  glow.addColorStop(0, hexA(col, 0.38));
  glow.addColorStop(0.4, hexA(col, 0.15));
  glow.addColorStop(1, hexA(col, 0));
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(c, y, r * 3.4, 0, Math.PI * 2); ctx.fill();
  if (layers.includes('flare')) {
    const fr = r * 2.7 * (1 + 0.07 * Math.sin(t * 5));
    const fg = ctx.createRadialGradient(c, y, 0, c, y, fr);
    fg.addColorStop(0, hexA('#ff7a3c', 0.55)); fg.addColorStop(1, hexA('#ff7a3c', 0));
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(c, y, fr, 0, Math.PI * 2); ctx.fill();
  }
  if (layers.includes('plasma')) {
    const pr = r * 2.1;
    const pg = ctx.createRadialGradient(c, y, 0, c, y, pr);
    pg.addColorStop(0, hexA('#ff9a3c', 0.3)); pg.addColorStop(1, hexA('#ff9a3c', 0));
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(c, y, pr, 0, Math.PI * 2); ctx.fill();
  }
  if (layers.includes('magnet')) {
    ctx.save(); ctx.translate(c, y); ctx.rotate(t * 0.6);
    ctx.strokeStyle = hexA('#6cb8ff', 0.8); ctx.lineWidth = 2;
    ctx.setLineDash([5, 12]); ctx.lineDashOffset = -t * 40;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.7, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  if (layers.includes('nova')) {
    const nr = r * 1.75 * (1 + 0.12 * Math.sin(t * 2.4));
    ctx.strokeStyle = hexA('#b26bff', 0.65); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(c, y, nr, 0, Math.PI * 2); ctx.stroke();
  }
  if (layers.length > 0) {
    const coreR = r * 0.5;
    const cg = ctx.createRadialGradient(c, y, 0, c, y, coreR);
    cg.addColorStop(0, '#ffffff');
    cg.addColorStop(0.5, hexA(col, 0.95));
    cg.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(c, y, coreR, 0, Math.PI * 2); ctx.fill();
  }
}

function frame(ts) {
  const t = ts / 1000;
  ctx.fillStyle = '#04040c';
  ctx.fillRect(0, 0, innerWidth, innerHeight);
  for (const s of stars) {
    const a = 0.25 + 0.55 * Math.abs(Math.sin(t * s.spd + s.tw));
    ctx.fillStyle = 'rgba(210,224,255,' + a + ')';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  if (phase !== 'explode') drawSun(t);
  if (phase === 'explode') {
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    if (flashA > 0.01) {
      const fg = ctx.createRadialGradient(sunX(), sunY(), 0, sunX(), sunY(), sunR() * 2.2);
      fg.addColorStop(0, 'rgba(255,240,200,' + flashA + ')');
      fg.addColorStop(0.4, 'rgba(255,170,90,' + flashA * 0.7 + ')');
      fg.addColorStop(1, 'rgba(255,80,40,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(sunX(), sunY(), sunR() * 2.2, 0, Math.PI * 2); ctx.fill();
    }
  }
  raf = requestAnimationFrame(frame);
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life--;
    p.x += p.vx; p.y += p.vy; p.vy += 0.035; p.vx *= 0.99;
    if (p.life <= 0) particles.splice(i, 1);
  }
  flashA *= 0.94;
  if (phase === 'explode' && particles.length === 0) {
    phase = 'over';
    score = energy;
    if (score > best) { best = score; localStorage.setItem('invent-sun-best', String(best)); }
    panelScore.textContent = score;
    panelSub.textContent = 'best ' + best;
    overlay.classList.add('show');
  }
}

function frameLoop(ts) {
  const t = ts / 1000;
  if (phase === 'explode') updateParticles();
  frame(ts);
}

igniteBtn.onclick = () => { if (phase === 'idle' && energy >= 100) ignite(); };
againBtn.onclick = () => {
  phase = 'idle'; energy = 0; layers = []; particles = []; flashA = 0; score = 0;
  baseR = 34; cycle = 0;
  overlay.classList.remove('show');
  updateEnergyUI();
};

updateEnergyUI();
raf = requestAnimationFrame(frameLoop);
</script>
</body>
</html>
